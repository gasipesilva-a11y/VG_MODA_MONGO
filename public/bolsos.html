<!DOCTYPE html>
<html lang="es">

<head>

    <!-- Configuración básica -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título de la página -->
    <title>Bolsos - VG MODA</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css">

</head>

<body>


    <!-- =========================
         TÍTULO PRINCIPAL
    ========================== -->

    <h1 class="titulo text-center mt-4">
        Catálogo De Bolsos
    </h1>


    <!-- =========================
         CONTENEDOR PRODUCTOS
    ========================== -->

    <div class="container contenedor-productos">


        <!-- Producto 1 -->
        <div class="card-producto">

            <img src="carpeta-imagenes/bolsos1.png"
                 alt="Tote Black">

            <h4>Tote Black</h4>

            <p class="precio">
                $60.000 COP
            </p>

        </div>


        <!-- Producto 2 -->
        <div class="card-producto">

            <img src="carpeta-imagenes/bolsos2.png"
                 alt="Pink Ribbon">

            <h4>Pink Ribbon</h4>

            <p class="precio">
                $75.000 COP
            </p>

        </div>


        <!-- Producto 3 -->
        <div class="card-producto">

            <img src="carpeta-imagenes/bolsos3.png"
                 alt="Café Élite">

            <h4>Café Élite</h4>

            <p class="precio">
                $80.000 COP
            </p>

        </div>


        <!-- Producto 4 -->
        <div class="card-producto">

            <img src="carpeta-imagenes/bolsos4.png"
                 alt="Ivory Pearl">

            <h4>Ivory Pearl</h4>

            <p class="precio">
                $55.000 COP
            </p>

        </div>

    </div>


    <!-- =========================
         BOTÓN VOLVER
    ========================== -->

    <div class="text-center mt-5 mb-5">

        <a href="index.html" class="volver">
            Volver al inicio
        </a>

    </div>

</html>
